<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>종문·수희 결혼식 사회 대본</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Reading page for the MC: high-contrast neutral palette, one accent reserved for lines to call out loud.
   Order rail on the left (a sticky chip strip on phones); one step's script at a time in a column sized for the podium */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --ink:#111318; --muted:#5A6170; --line:#E2E5EB;
  --accent:#2547C8; --accent-ink:#FFFFFF; --accent-soft:#E8EDFC;
  --cue:#8A5A00; --cue-soft:#FFF1D1; --quote:#F0F2F5;
  --del:#B42318; --del-soft:#FDECEA; --ins:#0F7B4B; --ins-soft:#E3F5EC;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --fs:1.3rem;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1014; --surface:#161920; --ink:#EEF0F4; --muted:#A0A7B4; --line:#2A2F39;
    --accent:#9DB2FF; --accent-ink:#0E1014; --accent-soft:#1E2640;
    --cue:#F6C453; --cue-soft:#3A2E10; --quote:#1E222A;
    --del:#FF9A8E; --del-soft:#3A1D1A; --ins:#6FD9A6; --ins-soft:#15301F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1014; --surface:#161920; --ink:#EEF0F4; --muted:#A0A7B4; --line:#2A2F39;
  --accent:#9DB2FF; --accent-ink:#0E1014; --accent-soft:#1E2640;
  --cue:#F6C453; --cue-soft:#3A2E10; --quote:#1E222A;
  --del:#FF9A8E; --del-soft:#3A1D1A; --ins:#6FD9A6; --ins-soft:#15301F;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:flex-end;gap:10px 16px;flex-wrap:wrap}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 12px;font-weight:600;font-size:.88rem;min-height:40px;color:var(--ink)}
.btn:hover{background:var(--bg)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.note{font-size:.8rem;color:var(--muted);min-height:1em}

.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 56px}
.viewbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;margin:0 0 16px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--muted);margin:0;min-width:0}
.legend span{display:inline-flex;align-items:center;gap:5px}
.viewtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;gap:2px;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--surface)}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:600;font-size:.9rem;min-height:36px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.layout{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}

.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow:auto}
.steps ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps button{width:100%;display:flex;gap:10px;align-items:baseline;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 10px;font-size:.97rem;color:var(--muted);font-weight:500}
.steps .n{font-variant-numeric:tabular-nums;font-weight:700;min-width:1.4em;text-align:right}
.steps button:hover{background:var(--surface);color:var(--ink)}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:700;box-shadow:inset 3px 0 0 var(--accent)}
.steps button[aria-current="step"] .n{color:var(--accent)}
.steps .keep{margin-left:auto;font-size:.75rem;font-weight:600;font-variant-numeric:tabular-nums}

main.stage{min-width:0;scroll-margin-top:16px;display:flex;flex-direction:column;gap:16px}
.step{scroll-margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding-block:26px 22px;padding-inline:clamp(18px,4vw,40px)}
.count{font-size:.8rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.step h2{font-weight:800;font-size:clamp(1.45rem,3vw,1.9rem);line-height:1.3;margin:4px 0 12px;letter-spacing:-.01em}
.calls{display:flex;flex-wrap:wrap;gap:6px}
.calls span{font-size:.85rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 11px}

.script{font-size:var(--fs);line-height:1.8;font-weight:500;max-width:36em;margin-top:20px;display:flex;flex-direction:column;gap:.55em}
.script p,.script blockquote,.script h3{margin:0}
.call-line{font-size:1.15em}
.shout{color:var(--accent);font-weight:800}
.dir{font-size:.74em;color:var(--muted);font-weight:500;padding-top:.45em}
.idir{font-size:.74em;color:var(--muted);font-weight:500}
.cue{display:inline-block;font-size:.62em;font-weight:700;color:var(--cue);background:var(--cue-soft);border-radius:6px;padding:.12em .5em;margin-left:.35em;vertical-align:.18em;line-height:1.45}
.legend .cue{font-size:.78rem;margin:0}
.play{border:0;cursor:pointer;font-size:14px;line-height:1.3;padding:.3em .75em;vertical-align:.1em}
.play:hover{filter:brightness(.95)}
dialog#player{border:0;padding:0;background:#000;border-radius:14px;width:min(960px,94vw);max-height:90vh;overflow:hidden}
dialog#player::backdrop{background:rgba(0,0,0,.75)}
dialog#player video{display:block;width:100%;max-height:calc(90vh - 56px);background:#000}
dialog#player form{display:flex;justify-content:flex-end;padding:8px}
dialog#player .btn{background:#1F2229;color:#FFF;border-color:#3A3F4A}
.player-title{margin:0;padding:12px 16px 4px;color:#FFF;font-weight:700;font-size:.95rem}
dialog#player.is-audio{position:fixed;inset:auto 0 16px 0;margin:0 auto;z-index:20;width:min(520px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.18)}
dialog#player.is-audio[open]{display:grid;grid-template-columns:1fr auto;align-items:center}
dialog#player.is-audio form{grid-row:1;grid-column:2;padding:6px 8px 0}
dialog#player.is-audio audio{grid-column:1/-1;margin:2px 12px 12px}
/* keep the end of the script reachable above the docked music player */
body.has-dock{padding-bottom:120px}
dialog#player.is-audio .player-title{color:var(--ink)}
dialog#player audio{display:block;width:calc(100% - 24px);margin:8px 12px 0}
dialog#player.is-audio .btn{background:var(--surface);color:var(--ink);border-color:var(--line)}
.legend .idir{font-size:inherit}
.q{background:var(--quote);border-radius:12px;padding:.6em .9em}
.tag{display:inline-block;font-size:.6em;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:.08em .45em;margin-right:.5em;vertical-align:.22em;line-height:1.45}
.legend .tag{font-size:.74rem;margin:0}
.legend .qbox{background:var(--quote);border-radius:5px;padding:0 .45em}
.q .tag{display:block;width:max-content;margin-bottom:.3em}
.sub{font-size:.78em;font-weight:700;color:var(--muted);padding-top:.9em;padding-bottom:.25em;border-bottom:1px solid var(--line)}

.ifs{margin-top:28px;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;font-size:calc(var(--fs) * .78);max-width:44em}
.ifs h3{margin:0 0 8px;font-size:.75rem;font-weight:700;color:var(--muted)}
.ifs dl{margin:0;display:grid;gap:10px}
.ifs dt{font-weight:700;font-size:.82em;color:var(--muted)}
.ifs dd{margin:2px 0 0;line-height:1.65}
.memo ul{margin:0;padding-left:1.2em;display:grid;gap:6px;line-height:1.65}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:28px}
.pager button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;min-height:64px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0}
.pager .next{align-items:flex-end;text-align:right;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pager small{font-size:.75rem;opacity:.8}
.pager strong{font-size:1rem}
.pager button[disabled]{visibility:hidden}

/* Compare view: Excel original beside the script, word-level changes marked */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px 28px;margin-top:18px}
.cmp .col{font-size:calc(var(--fs) * .8);line-height:1.75;min-width:0}
.cmp .col p{margin:0 0 .55em}
.col-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:8px;margin-bottom:12px;border-bottom:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.col-h b{font-size:1rem;color:var(--ink)}
.col-h .btn{margin-left:auto;min-height:32px;padding:4px 10px;font-size:.8rem}
del.x{color:var(--del);background:var(--del-soft);text-decoration:line-through;border-radius:4px;padding:0 .15em}
ins.x{background:var(--ins-soft);text-decoration:underline 2px var(--ins);text-underline-offset:3px;border-radius:4px;padding:0 .15em}

@media (max-width:820px){
  .layout{display:block}
  .steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;max-height:none;overflow-x:auto;overflow-y:hidden;background:var(--bg);margin-inline:-16px;padding:8px 16px;border-bottom:1px solid var(--line);scrollbar-width:none}
  .steps::-webkit-scrollbar{display:none}
  .steps ol{flex-direction:row;gap:6px}
  .steps button{white-space:nowrap;width:auto;border:1px solid var(--line);background:var(--surface);padding:8px 12px;font-size:.92rem;color:var(--ink)}
  .steps button[aria-current="step"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:none}
  .steps button[aria-current="step"] .n{color:var(--accent-ink)}
  main.stage{scroll-margin-top:64px;margin-top:14px}
  .step{border-radius:14px;padding-inline:18px;padding-block:22px 18px;scroll-margin-top:64px}
  .cmp{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}

/* Print: the whole script on A4, black on white, controls and the order rail left out */
@media print{
  @page{size:A4;margin:15mm 16mm 17mm;@bottom-center{content:counter(page) " / " counter(pages);font-size:9pt;color:#666}}
  :root{--bg:#fff;--surface:#fff;--ink:#000;--muted:#555;--line:#bbb;--accent:#1D3BB0;--accent-soft:#E8EDFC;--cue:#6B4500;--cue-soft:#FFF1D1;--quote:#F0F2F5;color-scheme:light}
  html,body{background:#fff}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  header.top,.viewbar,.steps,.pager,.calls{display:none!important}
  .wrap{padding:0;max-width:none}
  .layout{display:block}
  main.stage{display:block}
  .step{border:0;border-radius:0;padding:0;margin:0 0 9mm}
  .count{font-size:8.5pt;break-after:avoid}
  .step h2{font-size:15pt;margin:1mm 0 3mm;padding-bottom:1.5mm;border-bottom:1.2pt solid #000;break-after:avoid}
  .script{font-size:12.5pt;line-height:1.6;max-width:none;margin-top:0;gap:.3em}
  .script p,.script blockquote{break-inside:avoid}
  .sub,.dir{break-after:avoid}
  .ifs{font-size:10pt;margin-top:4mm;padding:2.5mm 3.5mm;break-inside:avoid}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="tools">
      <span class="note" id="note" aria-live="polite"></span>
      <button class="btn" id="fsDown" aria-label="글자 작게">가−</button>
      <button class="btn" id="fsUp" aria-label="글자 크게">가+</button>
      <button class="btn" id="wake" aria-pressed="false">화면 켜두기</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="viewbar">
    <p class="legend" id="legend">
      <span><strong class="shout">굵은 파란 글씨</strong> 크게 외치기</span>
      <span><span class="idir">(회색 괄호)</span> 읽지 않는 동작</span>
      <span><span class="cue">음악</span> 음향팀 큐 · <span class="cue">▶</span> 누르면 미리 듣기·보기</span>
      <span><span class="tag">선택</span> 생략 가능</span>
      <span><span class="qbox">회색 상자</span> 신랑 신부 대신 읽는 말</span>
    </p>
    <p class="legend" id="cmpLegend" hidden>
      <span><del class="x">취소선</del> 원본에서 바뀌거나 빠진 말</span>
      <span><ins class="x">밑줄</ins> 새로 쓴 말</span>
      <span><span class="idir">(괄호)</span> 지문은 비교 안 함</span>
      <span>순서 옆 % 원본 단어가 남은 비율</span>
    </p>
    <div class="viewtools">
      <button class="btn" id="cmpBtn" aria-pressed="false">원본과 비교</button>
      <div class="seg" role="group" aria-label="보기 방식"><button id="mode-step" data-mode="step" aria-pressed="true">순서별</button><button id="mode-all" data-mode="all" aria-pressed="false">전체 대본</button></div>
    </div>
  </div>
  <div class="layout">
    <nav class="steps" aria-label="식순"><ol id="stepList"></ol></nav>
    <main class="stage" id="stage" tabindex="-1"></main>
  </div>
</div>

<dialog id="player" aria-label="미리보기">
  <p class="player-title"></p>
  <video controls playsinline preload="none"></video>
  <audio controls preload="none"></audio>
  <form method="dialog"><button class="btn">닫기</button></form>
</dialog>

<script>
// v5: final.md wording, plus stage cues and fallback lines
const V5 = {
  steps: [
    { short: "식전 안내", title: "식전 안내", video: "media/pre.mp4", lines: [
      "(예식 10분 전, 식전영상이 나오는 동안) [영상]",
      "잠시 안내 말씀 드리겠습니다.",
      "잠시 후 신랑 박종문 군과 신부 윤수희 양의 결혼식이 시작될 예정입니다.",
      "밖에 계신 하객 여러분께서는 식장 안으로 들어오셔서, 마련된 자리에 착석해 주시기 바랍니다.",
      "그리고 휴대전화는 진동으로 바꿔 주시고, 예식 중에는 자리 이동을 삼가 주시면 감사하겠습니다.",
      "(선택) 뒤쪽에 계신 분들은 앞쪽 빈자리부터 채워서 앉아 주시면 감사하겠습니다."
    ]},
    { short: "인사·개식", title: "사회자 인사 · 개식", lines: [
      "(식전영상 끝났는지 확인)",
      "안녕하십니까.",
      "바쁘신 와중에도 우리 신랑 신부를 축복하러 와 주신 내빈 여러분께,",
      "양가를 대신해 진심으로 감사드립니다.",
      "저는 오늘 사회를 맡게 된, 신랑의 친구 조상원입니다. 반갑습니다. ((인사))",
      "## 친구 소개",
      "신랑과는 중학교 때 만나 어느덧 20년이라는 세월을 함께 보냈습니다.",
      "그런 친구가 결혼을 한다고 하니, 기쁘면서도 제가 더 떨리는 것 같습니다.",
      "## 개식",
      "오늘은 신랑,신부가 직접 하객분들 앞에서 사랑을 맹세하는",
      "주례 없는 예식으로 진행 될 예정입니다.",
      "하객분들께서는 직접 증인이 되셔서 두 사람의 첫 시작을 응원해 주시기 바랍니다.",
      "그럼 지금부터 신랑 박종문 군과 신부 윤수희 양의 결혼식을 시작하겠습니다.",
      "큰 박수 부탁드리겠습니다."
    ]},
    { short: "화촉점화", title: "화촉점화 · 양가 어머님 인사", lines: [
      "먼저, 화촉점화 순서가 있겠습니다.",
      "화촉점화는 양가 어머님께서 촛불을 밝히며, 두 가정이 하나로 연을 맺는 시작을 알리는 순서입니다.",
      "양가 어머님께서는 단상 위로 오르시겠습니다.",
      "하객 여러분께서는 따뜻한 박수로 맞이해 주시기 바랍니다.",
      "**양가 어머님 입장!**",
      "(입장하시는 동안)",
      "두 어머님께서 밝혀 주실 촛불처럼, 두 사람의 앞날도 늘 환하게 빛나기를 바랍니다.",
      "(점화대 앞에 도착하시면)",
      "먼저 신랑 어머님께서 점화해 주시겠습니다.",
      "이어서 신부 어머님께서 점화해 주시겠습니다.",
      "(화촉점화 후)",
      "두 분 어머님께 큰 박수 부탁드리겠습니다.",
      "다음은 양가 어머님 맞절이 있겠습니다.",
      "양가 어머님께서는 서로 마주 보고 서 주시겠습니다.",
      "(서로 마주 보고 계신지 확인)",
      "서로 존중하는 마음을 담아서, **양가 어머님 인사!**",
      "이제 내빈 여러분을 향해 서 주시겠습니다.",
      "(내빈 쪽으로 돌아서셨는지 확인)",
      "오늘 찾아주신 내빈 여러분께, **양가 어머님 인사!**",
      "다시 한번 큰 박수 부탁드리겠습니다.",
      "양가 어머님께서는 자리로 돌아가 주시겠습니다."
    ], ifs: [
      ["입장이 늦어질 때", "네, 어머님들께서 지금 입장 준비를 하고 계십니다. 잠시만 기다려 주시겠습니다."],
      ["촛불이 잘 안 붙을 때", "촛불도 오늘 많이 설레나 봅니다. 천천히 다시 한번 밝혀 주시겠습니다."],
      ["점화가 길어질 때", "오늘을 누구보다 기다려 오셨을 두 분 어머님께, 따뜻한 박수 한번 더 부탁드리겠습니다."]
    ]},

  mode = b.dataset.mode;
  store.set("mode", mode);
  updateSeg(); renderStage(); scrollToCurrent();
}));
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && player.open) { player.close(); return; }
  if ((player.open && !player.classList.contains("is-audio")) || e.altKey || e.metaKey || e.ctrlKey) return;
  const n = items().length;
  if (e.key === "ArrowRight" && idx < n - 1) go(idx + 1);
  if (e.key === "ArrowLeft" && idx > 0) go(idx - 1);
});

// Font size: rem steps, remembered per viewer
let fs = parseFloat(store.get("fs")) || 1.3;
const applyFs = () => { document.documentElement.style.setProperty("--fs", fs + "rem"); store.set("fs", String(fs)); };
document.getElementById("fsUp").addEventListener("click", () => { fs = Math.min(2.4, +(fs + 0.1).toFixed(2)); applyFs(); });
document.getElementById("fsDown").addEventListener("click", () => { fs = Math.max(1, +(fs - 0.1).toFixed(2)); applyFs(); });
applyFs();

// Keep the screen awake at the podium; browsers may refuse, so it stays optional
const note = document.getElementById("note");
const wakeBtn = document.getElementById("wake");
let wantWake = false, lock = null;
function say(msg) { note.textContent = msg; clearTimeout(say.t); say.t = setTimeout(() => { note.textContent = ""; }, 3000); }
async function acquire() {
  try {
    lock = await navigator.wakeLock.request("screen");
    lock.addEventListener("release", () => { lock = null; });
    return true;
  } catch (e) { lock = null; return false; }
}
wakeBtn.addEventListener("click", async () => {
  if (wantWake) {
    wantWake = false;
    try { if (lock) await lock.release(); } catch (e) {}
    lock = null;
    wakeBtn.setAttribute("aria-pressed", "false");
    say("화면 켜두기를 껐어요");
    return;
  }
  if (!("wakeLock" in navigator) || !(await acquire())) { say("이 기기에서는 화면 켜두기를 쓸 수 없어요"); return; }
  wantWake = true;
  wakeBtn.setAttribute("aria-pressed", "true");
  say("화면이 꺼지지 않아요");
});
document.addEventListener("visibilitychange", () => {
  if (wantWake && document.visibilityState === "visible" && !lock) acquire();
});

// Printing always lays out the whole script without the compare view, then puts the screen back
let beforePrint = null;
addEventListener("beforeprint", () => {
  beforePrint = { mode, compare, idx };
  mode = "all"; compare = false;
  renderStage();
});
addEventListener("afterprint", () => {
  if (!beforePrint) return;
  ({ mode, compare, idx } = beforePrint);
  beforePrint = null;
  renderNav(); renderStage(); scrollToCurrent();
});

updateSeg();
renderNav();
renderStage();
if (mode === "all" && idx > 0) scrollToCurrent();
</script>

</body>
</html>
